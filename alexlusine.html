        <header class="section text-center text-white" style="background:#3586ff">

                <p class="section-subtitle text-white-50 mb-0">Frontend enthusiast</p>

        <section class="section">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-md-4 text-center">
                        <img class="profile-image" src="unnamed.jpg" alt="Alex profile" />
                    </div>
                    <div class="col-12 col-md-8">

                            Passionate about clean interfaces and smooth interactions. Enjoys building responsive

                        </p>

        <section class="section bg-light">

                                <form action="#" method="post" class="row g-3">

                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="email">Email</label>
                                        <input class="form-control" id="email" name="email" required type="email" />
                                    </div>
                                    <div class="col-12">
                                        <button class="btn btn-primary" type="submit">Submit</button>
                                    </div>
                                </form>
                            </div>
